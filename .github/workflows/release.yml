name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag, for example v1.2.3
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-latest

    env:
      # Base64-encoded Developer ID Application certificate (.p12).
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      # Password used to export the .p12 certificate from Keychain Access.
      MAC_CERTIFICATE_PWD: ${{ secrets.MAC_CERTIFICATE_PWD }}
      # Password for the temporary CI keychain created during the build.
      MAC_KEYCHAIN_PWD: ${{ secrets.MAC_KEYCHAIN_PWD }}
      # Signing identity, e.g. "Developer ID Application: Your Name (TEAMID)".
      MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
      # Apple Developer Team ID.
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      # Apple ID email used for notarization.
      MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      # App-specific password used for notarization.
      MAC_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up macOS code signing
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          security create-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MAC_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            -o AppleRootCA-G3.cer
          curl -fsSL \
            https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer \
            -o AppleWWDRCAG6.cer
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o DeveloperIDG2CA.cer

          security import AppleRootCA-G3.cer -k "$KEYCHAIN_PATH"
          security import AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH"
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE" \
            | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERTIFICATE_PWD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$MAC_KEYCHAIN_PWD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Set application version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z or vX.Y.Z"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"

          plutil -replace app.version.major -string "$major" mobrowser.conf.json
          plutil -replace app.version.minor -string "$minor" mobrowser.conf.json
          plutil -replace app.version.patch -string "$patch" mobrowser.conf.json

          echo "Application version set to $version"

      - name: Build and package release
        run: npx --no-install mobrowser build --verbose

      - name: Show generated installers
        shell: bash
        run: find build -type f -name '*.dmg' -print

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mo-voice-macos-arm64
          path: build/dist/mac-arm64/pack/*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    needs:
      - build-macos

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/macos-arm64
          mv dist/mo-voice-macos-arm64/*.dmg dist/macos-arm64/
          find dist -maxdepth 3 -type f -print

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/macos-arm64/*.dmg
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          draft: true