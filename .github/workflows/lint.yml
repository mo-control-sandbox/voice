name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate proto types
        run: npm run gen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint TypeScript
        run: npm run lint:ts

      - name: Lint CSS
        run: npm run lint:css

  lint-native:
    name: Native Lint (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate proto types
        run: npm run gen

      - name: Configure CMake (generate compile_commands.json for clang-tidy)
        run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -B build -S .

      - name: Setup LLVM
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm@20
          llvm_prefix="$(brew --prefix llvm@20)"
          echo "${llvm_prefix}/bin" >> "${GITHUB_PATH}"
          echo "LLVM_PATH=${llvm_prefix}" >> "${GITHUB_ENV}"

      - name: Lint C++
        shell: bash
        run: |
          set -euo pipefail
          clang_tidy_version="$(clang-tidy --version)"
          if [[ "$clang_tidy_version" == *"version 20."* ]]; then
            # LLVM 20 clang-tidy crashes on Objective-C headers with this check: https://github.com/llvm/llvm-project/issues/129861
            run-clang-tidy -checks=-cppcoreguidelines-avoid-const-or-ref-data-members -source-filter='^.*/src/native/.*' -p build
          else
            run-clang-tidy -source-filter='^.*/src/native/.*' -p build
          fi
