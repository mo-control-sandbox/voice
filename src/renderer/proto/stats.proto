syntax = "proto3";

import "google/protobuf/empty.proto";

/** Aggregate productivity metrics for the Settings dashboard. */
message DashboardStatsResponse {
  int32 total_sessions = 1;
  int32 total_words = 2;
  double total_time_saved_seconds = 3;
  double words_per_minute = 4;
  int32 keystrokes_saved = 5;
}

service StatsService {
  rpc GetStats(google.protobuf.Empty) returns (DashboardStatsResponse);
}
