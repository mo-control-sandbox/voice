syntax = "proto3";

message PollRequest {}

message RecordingSignalSnapshotProto {
  string state               = 1;  // "idle" | "recording" | "processing"
  string session_id          = 2;
  int64  started_at          = 3;
  bool   dont_save_audio     = 4;
  bool   dont_save_transcripts = 5;
  int64  max_duration_ms     = 6;
}

message ReverseIpcBridgeResponse {
  RecordingSignalSnapshotProto recording = 1;
}

service ReverseIpcBridgeService {
  rpc Poll(PollRequest) returns (ReverseIpcBridgeResponse);
}
