syntax = "proto3";

message PollRecordingRequest {}
message PollHistoryRevisionRequest {}

enum RecordingPhase {
  RECORDING_PHASE_UNSPECIFIED = 0;
  RECORDING_PHASE_IDLE = 1;
  RECORDING_PHASE_RECORDING = 2;
  RECORDING_PHASE_PROCESSING = 3;
}

message RecordingState {
  RecordingPhase phase       = 1;
  string session_id = 2;
  int64 started_at = 3;
  bool save_audio = 4;
  bool save_transcripts = 5;
}

message PollRecordingResponse {
  RecordingState recording = 1;
}

message PollHistoryRevisionResponse {
  int32 history_revision = 1;
}

service ReverseIpcBridgeService {
  rpc PollRecording(PollRecordingRequest) returns (PollRecordingResponse);
  rpc PollHistoryRevision(PollHistoryRevisionRequest) returns (PollHistoryRevisionResponse);
}
