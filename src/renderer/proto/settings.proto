syntax = "proto3";

import "google/protobuf/empty.proto";

message GetSettingsRequest {}

message SettingsProto {
  bool   dont_save_transcripts = 2;
  bool   dont_save_audio       = 3;
  string shortcut_key          = 4;
  string audio_input_device_id = 5;
}

message SetAudioInputDeviceRequest {
  string device_id = 1;
}

message SetShortcutKeyRequest {
  string shortcut_key = 1;
}

message SetBooleanSettingRequest {
  bool value = 1;
}

message SetShortcutCaptureModeRequest {
  bool capturing = 1;
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest)                         returns (SettingsProto);
  rpc SetAudioInputDevice(SetAudioInputDeviceRequest)         returns (google.protobuf.Empty);
  rpc SetShortcutKey(SetShortcutKeyRequest)                   returns (google.protobuf.Empty);
  rpc SetDontSaveTranscripts(SetBooleanSettingRequest)        returns (google.protobuf.Empty);
  rpc SetDontSaveAudio(SetBooleanSettingRequest)              returns (google.protobuf.Empty);
  rpc SetShortcutCaptureMode(SetShortcutCaptureModeRequest)   returns (google.protobuf.Empty);
  rpc MarkOnboardingComplete(google.protobuf.Empty)           returns (google.protobuf.Empty);
  rpc SetModelReady(SetBooleanSettingRequest)                 returns (google.protobuf.Empty);
}
