syntax = "proto3";

import "google/protobuf/empty.proto";

message GetSessionsRequest {}

/**
 * Wire representation of a single transcription session record.
 *
 * `transcription_text` is the empty string when no transcript was saved
 * for the session.
 */
message SessionRecordProto {
  string id                          = 1;
  int64  started_at                  = 2;
  string transcription_engine_label  = 3;
  double audio_duration_seconds      = 4;
  double transcription_duration_ms   = 5;
  int32  word_count                  = 6;
  string transcription_text          = 7;
  string detected_language           = 9;
}

message SessionListResponse {
  repeated SessionRecordProto sessions = 1;
}

message SessionIdRequest {
  string id = 1;
}

message AudioDataResponse {
  bytes audio_data = 1;
}

message DeleteSessionRequest {
  string id = 1;
}

service HistoryService {
  rpc GetSessions(GetSessionsRequest)              returns (SessionListResponse);
  rpc DeleteSession(DeleteSessionRequest)          returns (google.protobuf.Empty);
  rpc GetAudioData(SessionIdRequest)               returns (AudioDataResponse);
  rpc RevealSessionFolder(SessionIdRequest)        returns (google.protobuf.Empty);
}
