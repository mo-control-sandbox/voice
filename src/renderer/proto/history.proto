syntax = "proto3";

import "google/protobuf/empty.proto";

/**
 * Request for loading stored transcription sessions.
 */
message GetSessionsRequest {}

/**
 * Wire representation of a single transcription session record.
 *
 * `transcription_text` is the empty string when no transcript was saved
 * for the session.
 */
message SessionRecordProto {
  /**
   * Stable session identifier.
   */
  string id = 1;
  /**
   * Session start timestamp in Unix milliseconds.
   */
  int64 started_at = 2;
  /**
   * Label of the transcription engine used for this session.
   */
  string transcription_engine_label = 3;
  /**
   * Captured audio duration in seconds.
   */
  double audio_duration_seconds = 4;
  /**
   * Number of words in the final transcription text.
   */
  int32 word_count = 6;
  /**
   * Saved transcription text, or empty when transcript persistence was disabled.
   */
  string transcription_text = 7;
}

/**
 * Response containing all visible transcription sessions.
 */
message SessionListResponse {
  repeated SessionRecordProto sessions = 1;
}

/**
 * Request that targets one session by identifier.
 */
message SessionIdRequest {
  string id = 1;
}

/**
 * Response containing persisted audio bytes for a session.
 */
message AudioDataResponse {
  bytes audio_data = 1;
}

/**
 * Request for reading a specific byte range from one session audio file.
 */
message AudioChunkRequest {
  string id = 1;
  uint32 offset = 2;
  uint32 length = 3;
}

/**
 * Response describing whether audio exists and its total size in bytes.
 */
message AudioInfoResponse {
  bool has_audio = 1;
  uint32 total_bytes = 2;
}

/**
 * Request for deleting a stored session and associated artifacts.
 */
message DeleteSessionRequest {
  string id = 1;
}

/**
 * History retrieval and maintenance contract.
 */
service HistoryService {
  /**
   * Returns all stored sessions for history browsing.
   */
  rpc GetSessions(GetSessionsRequest) returns (SessionListResponse);
  /**
   * Deletes one session and its persisted assets when present.
   */
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
  /**
   * Returns audio bytes for a session when audio persistence is available.
   */
  rpc GetAudioData(SessionIdRequest) returns (AudioDataResponse);
  /**
   * Returns audio availability and total byte size for one session.
   */
  rpc GetAudioInfo(SessionIdRequest) returns (AudioInfoResponse);
  /**
   * Returns one byte-range chunk from persisted audio for one session.
   */
  rpc GetAudioChunk(AudioChunkRequest) returns (AudioDataResponse);
  /**
   * Opens the session storage folder in the operating system file manager.
   */
  rpc RevealSessionFolder(SessionIdRequest) returns (google.protobuf.Empty);
}
