syntax = "proto3";

import "google/protobuf/empty.proto";
import "error.proto";

/** A single model entry with catalog metadata and runtime download/active state. */
message ModelEntryProto {
  string id = 1;
  string label = 2;
  string description = 3;
  double file_size_bytes = 4;
  string hugging_face_repo = 5;
  float speed_score = 6;
  float accuracy_score = 7;
  bool is_multilingual = 8;
  bool is_builtin = 9;
  bool is_downloaded = 10;
  bool is_active = 11;
  // 0.0–1.0 while downloading; -1 when no download is in progress.
  float download_progress = 12;
}

message ModelListResponse {
  repeated ModelEntryProto models = 1;
  string storage_path = 2;
}

message ModelIdRequest {
  string model_id = 1;
}

message DownloadProgressResponse {
  // 0.0–1.0 while downloading; -1 when no download is in progress.
  float progress = 1;
}

message PathRequest {
  string path = 1;
}

service ModelService {
  rpc GetModels(google.protobuf.Empty) returns (ModelListResponse);
  rpc DownloadModel(ModelIdRequest) returns (google.protobuf.Empty);
  rpc CancelDownload(ModelIdRequest) returns (google.protobuf.Empty);
  rpc DeleteModel(ModelIdRequest) returns (google.protobuf.Empty);
  rpc SetActiveModel(ModelIdRequest) returns (google.protobuf.Empty);
  rpc GetDownloadProgress(ModelIdRequest) returns (DownloadProgressResponse);
  rpc PickStoragePath(google.protobuf.Empty) returns (StringResponse);
  rpc SetStoragePath(PathRequest) returns (google.protobuf.Empty);
  rpc RevealInFinder(ModelIdRequest) returns (google.protobuf.Empty);
}
