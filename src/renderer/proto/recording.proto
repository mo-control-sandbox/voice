syntax = "proto3";

import "google/protobuf/empty.proto";

message CancelRecordingRequest {
  string session_id = 1;
}

message SubmitTranscriptionRequest {
  string session_id                 = 1;
  string text                       = 2;
  string detected_language          = 3;
  float  audio_duration_seconds     = 4;
  int64  transcription_duration_ms  = 5;
  string transcription_engine_label = 6;
  bytes  pcm                        = 7;
}

service RecordingService {
  rpc CancelRecording(CancelRecordingRequest)           returns (google.protobuf.Empty);
  rpc SubmitTranscription(SubmitTranscriptionRequest)   returns (google.protobuf.Empty);
}
